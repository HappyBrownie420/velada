<!doctype html>
<html lang="es" data-shell="ios">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Velada">
<meta name="theme-color" content="#1E1B4B">
<script src="vendor/tailwind.js"></script>
<!-- @artifact-start -->
<title>Velada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Roboto:wght@400;500;700&display=swap">
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { night: '#1E1B4B', deep: '#312E81', ivory: '#FFFBF2', lav: '#EEF2F6', gold: '#FBBF24' },
      fontFamily: { display: ['Fraunces', 'Georgia', 'serif'] }
    } }
  };
</script>
<style>
  /* Layout: una sola columna con forma de teléfono; las vistas viven entre una barra superior y una barra de pestañas
     que cambian de piel (iOS Cupertino / Android Material). En escritorio el teléfono queda centrado. */
  :root {
    --night: #1E1B4B;        /* índigo noche, fondo exterior */
    --indigo: #312E81;       /* índigo profundo, fondo de la app */
    --plum: #3B1747;         /* berenjena, bruma inferior */
    --ivory: #FFFBF2;        /* texto */
    --lav: #EEF2F6;          /* acentos delicados */
    --gold: #FBBF24;         /* gratitud */
    --muted: rgba(238, 242, 246, .66);
    --faint: rgba(238, 242, 246, .40);
    --line: rgba(238, 242, 246, .13);
    --surface: rgba(255, 255, 255, .055);
    --surface-2: rgba(255, 255, 255, .10);
    --sheet: #2A2770;
    --gold-soft: rgba(251, 191, 36, .14);
    --danger: #FDA4AF;
    --f-display: "Fraunces", Georgia, "Times New Roman", serif;
    --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
    --r-card: 16px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --gutter-l: max(16px, var(--sal));
    --gutter-r: max(16px, var(--sar));
    --ease-ios: cubic-bezier(.32, .72, 0, 1);
    --ease-md: cubic-bezier(.2, 0, 0, 1);
    color-scheme: dark;
  }
  html[data-shell="md"] {
    --f-ui: Roboto, "Google Sans", system-ui, "Segoe UI", Arial, sans-serif;
    --r-card: 12px;
    --sheet: #2E2B78;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--ivory); font-family: var(--f-ui);
    -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  html[data-shell="ios"] .md-only, html[data-shell="md"] .ios-only { display: none !important; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }
  .ic { flex: none; display: block; }

  /* ---------- Teléfono ---------- */
  #app {
    position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(120% 55% at 85% -8%, rgba(124, 58, 237, .30), transparent 62%),
      radial-gradient(110% 60% at -15% 112%, var(--plum), transparent 62%),
      var(--indigo);
  }
  @media (min-width: 640px) and (min-height: 640px) {
    body { display: grid; place-items: center;
      background: radial-gradient(60% 60% at 50% 40%, #2a2670, var(--night)); }
    #app { width: 400px; height: min(860px, calc(100% - 48px)); border-radius: 44px;
      border: 1px solid var(--line); box-shadow: 0 40px 120px -30px rgba(0,0,0,.7), 0 0 0 10px rgba(14,12,40,.9); }
  }
  #stars {
    position: absolute; inset: 0; pointer-events: none; opacity: .55; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 68% 9%, #fff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 84% 31%, #FDE68A 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 42%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 72%, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 22% 81%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 63%, #fff 50%, transparent 51%);
    background-size: 260px 260px;
  }
  #base {
    position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 1; overflow: hidden;
    transform-origin: 50% 0; transition: transform .45s var(--ease-ios), filter .45s var(--ease-ios), border-radius .45s;
  }
  #app.shell-swap #base, #app.shell-swap .page { animation: swap .45s var(--ease-md); }
  @keyframes swap { from { opacity: .25; filter: blur(4px); } to { opacity: 1; filter: none; } }

  /* ---------- Barra superior ---------- */
  .topbar {
    position: relative; z-index: 5; display: flex; align-items: center; gap: 10px; flex: none;
    padding: calc(var(--sat) + 8px) var(--gutter-r) 8px var(--gutter-l); min-height: 52px;
    border-bottom: .5px solid transparent; transition: background .25s, border-color .25s;
  }
  .tb-title { margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html[data-shell="ios"] #topbar .shell-switch { order: -1; }
  html[data-shell="ios"] #topbar .tb-title { opacity: 0; text-align: center; font: 600 17px/1.2 var(--f-ui); transition: opacity .2s; }
  html[data-shell="ios"] .topbar.scrolled { background: rgba(30, 27, 75, .72); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); border-bottom-color: var(--line); }
  html[data-shell="ios"] .topbar.scrolled .tb-title { opacity: 1; }
  html[data-shell="md"] .topbar { min-height: 64px; }
  html[data-shell="md"] .tb-title { font: 400 22px/28px var(--f-ui); }
  html[data-shell="md"] .topbar.scrolled { background: rgba(238, 242, 246, .07); }

  .shell-switch {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 76px; height: 30px; flex: none;
    border-radius: 999px; background: rgba(238, 242, 246, .10); border: 1px solid var(--line); padding: 2px;
    font: 700 11px/1 var(--f-ui); letter-spacing: .05em; color: var(--muted);
  }
  .shell-switch span { position: relative; z-index: 1; display: grid; place-items: center; transition: color .3s; }
  .shell-switch .knob { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: 999px; background: var(--lav); transition: transform .4s cubic-bezier(.3, 1.4, .5, 1); }
  html[data-shell="md"] .shell-switch .knob { transform: translateX(100%); }
  html[data-shell="ios"] .shell-switch [data-v="ios"], html[data-shell="md"] .shell-switch [data-v="md"] { color: var(--night); }

  .btn-export {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px; flex: none;
    border-radius: 999px; border: 1px solid rgba(251, 191, 36, .75); background: rgba(251, 191, 36, .10);
    color: var(--gold); font: 700 13px/1 var(--f-ui); letter-spacing: .02em;
  }
  .btn-export:active { background: rgba(251, 191, 36, .22); }

  /* ---------- Vistas ---------- */
  #views { position: relative; flex: 1; min-height: 0; }
  .view {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding: 4px var(--gutter-r) 36px var(--gutter-l);
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  html[data-shell="md"] .view { padding-bottom: 104px; }
  .view.active { opacity: 1; visibility: visible; pointer-events: auto; }
  html[data-shell="ios"] .view.active { animation: fadeIn .18s ease-out; }
  html[data-shell="md"] .view.active { animation: fadeThrough .32s var(--ease-md); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeThrough { 0% { opacity: 0; transform: scale(.94); } 30% { opacity: 0; } 100% { opacity: 1; transform: none; } }
  .stack { display: flex; flex-direction: column; gap: 22px; max-width: 560px; margin: 0 auto; }

  .lt { margin: 6px 0 0; font: 700 34px/1.12 var(--f-ui); letter-spacing: -.02em; text-wrap: balance; }
  html[data-shell="md"] .lt { display: none; }
  .eyebrow { margin: 0; font: 600 12px/1.3 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .greet { margin: 4px 0 0; font-family: var(--f-display); font-weight: 350; font-size: 36px; line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; font-variation-settings: "opsz" 120; }
  .greet em { font-style: italic; color: var(--lav); }
  .section-h { margin: 0 0 10px; font: 600 13px/1.3 var(--f-ui); color: var(--muted); letter-spacing: .02em; }
  html[data-shell="ios"] .section-h { text-transform: uppercase; font-size: 12px; letter-spacing: .08em; padding-left: 4px; }
  html[data-shell="md"] .section-h { color: var(--lav); font-weight: 500; font-size: 14px; }
  .muted { color: var(--muted); }

  /* ---------- Tarjetas ---------- */
  .card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; }
  html[data-shell="md"] .card { border-color: transparent; background: rgba(238, 242, 246, .075); }
  .card.tonight { overflow: hidden; }
  .card.tonight::before { content: ""; position: absolute; width: 180px; height: 180px; right: -60px; top: -70px; border-radius: 50%; background: radial-gradient(circle, rgba(251, 191, 36, .16), transparent 70%); pointer-events: none; }
  .blank-title { margin: 0; font-family: var(--f-display); font-size: 22px; line-height: 1.25; font-weight: 400; text-wrap: balance; }

  .qa { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-top: 1px solid var(--line); }
  .qa:first-child { border-top: 0; padding-top: 4px; }
  .qa-q { margin: 0; font-family: var(--f-display); font-style: italic; font-size: 16px; line-height: 1.35; color: var(--lav); opacity: .9; }
  .qa-a { margin: 0; font-size: 16px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qa.gold .qa-q { color: var(--gold); opacity: 1; }
  .qa.gold { position: relative; padding-left: 14px; }
  .qa.gold::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .qa.gold:first-child::before { top: 4px; }
  .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 14px 12px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
  html[data-shell="md"] .stat { border-color: transparent; background: rgba(238, 242, 246, .075); }
  .stat b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 6px; font-size: 12px; line-height: 1.3; color: var(--muted); }
  .stat.gold b { color: var(--gold); text-shadow: 0 0 18px rgba(251, 191, 36, .45); }

  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
  .week i { display: block; width: 12px; height: 12px; margin: 8px auto 0; border-radius: 50%; border: 1.5px solid var(--faint); }
  .week i.on { border-color: var(--gold); background: var(--gold); box-shadow: 0 0 10px rgba(251, 191, 36, .8); }
  .week small { font-size: 11px; color: var(--faint); font-weight: 600; }
  .week .is-today small { color: var(--lav); }

  .memory { border: 1px solid rgba(251, 191, 36, .35); background: linear-gradient(160deg, rgba(251, 191, 36, .12), rgba(251, 191, 36, .02) 70%); }
  .memory blockquote { margin: 8px 0 10px; font-family: var(--f-display); font-style: italic; font-size: 20px; line-height: 1.4; color: var(--ivory); overflow-wrap: anywhere; }
  .memory cite { font-style: normal; font-size: 13px; color: var(--gold); }

  .list { display: flex; flex-direction: column; }
  .list-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 4px; text-align: left; border-top: 1px solid var(--line); background: none; color: inherit; position: relative; overflow: hidden; }
  .list-row:first-child { border-top: 0; }
  .list-row:active { background: var(--surface); }
  .list-row .d { flex: none; width: 44px; text-align: center; font-family: var(--f-display); }
  .list-row .d b { display: block; font-size: 24px; font-weight: 400; line-height: 1; }
  .list-row .d small { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
  .list-row .t { flex: 1; min-width: 0; }
  .list-row .t p { margin: 0; font-size: 15px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .t small { color: var(--muted); font-size: 12px; }
  .star-dot { color: var(--gold); flex: none; }

  /* ---------- Botones ---------- */
  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; font-family: var(--f-ui); transition: transform .12s, background .2s, opacity .2s; }
  .btn-primary { background: var(--gold); color: var(--night); }
  .btn-tonal { background: var(--surface-2); color: var(--ivory); }
  .btn-ghost { background: transparent; color: var(--lav); }
  .btn-danger { background: rgba(253, 164, 175, .14); color: var(--danger); }
  html[data-shell="ios"] .btn { height: 50px; padding: 0 20px; border-radius: 14px; font-size: 17px; font-weight: 600; }
  html[data-shell="ios"] .btn:active { opacity: .6; }
  html[data-shell="md"] .btn { height: 48px; padding: 0 24px; border-radius: 999px; font-size: 15px; font-weight: 500; letter-spacing: .01em; }
  .btn.sm { height: 40px !important; font-size: 15px !important; padding: 0 16px !important; }
  .w-full { width: 100%; }
  .rip { position: absolute; border-radius: 50%; background: currentColor; opacity: .18; transform: scale(0); animation: rip .55s var(--ease-md) forwards; pointer-events: none; }
  @keyframes rip { to { transform: scale(1); opacity: 0; } }

  /* ---------- FAB (Material) ---------- */
  .fab {
    display: none; position: absolute; z-index: 6; right: var(--gutter-r); bottom: calc(80px + var(--sab) + 16px);
    height: 56px; padding: 0 20px 0 16px; align-items: center; gap: 12px; border: 0; border-radius: 16px;
    background: var(--gold); color: var(--night); font: 500 15px/1 var(--f-ui); overflow: hidden;
    box-shadow: 0 6px 18px -4px rgba(0, 0, 0, .5), 0 0 30px -6px rgba(251, 191, 36, .55);
    transition: padding .25s var(--ease-md), transform .3s var(--ease-md);
  }
  html[data-shell="md"] #app[data-tab="hoy"] .fab, html[data-shell="md"] #app[data-tab="cal"] .fab { display: inline-flex; }
  .fab.small { padding: 0 16px; }
  #app.toasting .fab { transform: translateY(-64px); }
  .fab.small .fab-label { display: none; }

  /* ---------- Barra de pestañas ---------- */
  .tabbar { position: relative; z-index: 5; flex: none; display: grid; grid-template-columns: repeat(3, 1fr); padding: 0 var(--gutter-r) var(--sab) var(--gutter-l); }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--faint); font-family: var(--f-ui); overflow: hidden; }
  .tab-ic { position: relative; display: grid; place-items: center; }
  html[data-shell="ios"] .tabbar { background: rgba(30, 27, 75, .78); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border-top: .5px solid var(--line); }
  html[data-shell="ios"] .tab { height: 52px; font-size: 10px; font-weight: 600; }
  html[data-shell="ios"] .tab.active { color: var(--gold); }
  html[data-shell="md"] .tabbar { background: #29266E; }
  html[data-shell="md"] .tab { height: 80px; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
  html[data-shell="md"] .tab-ic { overflow: hidden; width: 64px; height: 32px; border-radius: 16px; transition: background .25s; }
  html[data-shell="md"] .tab-ic::before { content: ""; position: absolute; inset: 0; border-radius: 16px; background: rgba(251, 191, 36, .2); transform: scaleX(.3); opacity: 0; transition: transform .3s var(--ease-md), opacity .2s; }
  html[data-shell="md"] .tab.active .tab-ic::before { transform: none; opacity: 1; }
  html[data-shell="md"] .tab.active { color: var(--ivory); }
  html[data-shell="md"] .tab.active .tab-ic { color: var(--gold); }
  .tab-ic .ic { position: relative; }

  /* ---------- Página empujada (editor) ---------- */
  .page { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; visibility: hidden; touch-action: pan-y;
    background: radial-gradient(120% 50% at 80% -10%, rgba(124, 58, 237, .28), transparent 60%), var(--indigo); }
  html[data-shell="ios"] .page { transform: translateX(100%); transition: transform .45s var(--ease-ios), visibility 0s .45s; box-shadow: -20px 0 40px -10px rgba(0, 0, 0, .45); }
  html[data-shell="ios"] #app.editing .page { transform: none; visibility: visible; transition: transform .45s var(--ease-ios), visibility 0s; }
  html[data-shell="ios"] #app.editing #base { transform: translateX(-28%); filter: brightness(.7); }
  html[data-shell="md"] .page { opacity: 0; transform: scale(.92); transition: opacity .3s var(--ease-md), transform .35s var(--ease-md), visibility 0s .35s; }
  html[data-shell="md"] #app.editing .page { opacity: 1; transform: none; visibility: visible; transition: opacity .3s var(--ease-md), transform .35s var(--ease-md), visibility 0s; }
  html[data-shell="md"] #app.editing #base { transform: scale(1.04); filter: brightness(.6); }
  .page-bar { gap: 4px; }
  html[data-shell="ios"] .page-bar { display: grid; grid-template-columns: 1fr auto 1fr; }
  html[data-shell="ios"] .page-bar .bar-btn:first-child { justify-self: start; }
  html[data-shell="ios"] .page-bar .tb-title { font: 600 17px/1.2 var(--f-ui); text-align: center; }
  .bar-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px; border: 0; background: none; color: var(--lav); font: 400 17px/1 var(--f-ui); }
  .bar-btn.done { justify-self: end; font-weight: 600; color: var(--gold); }
  html[data-shell="ios"] .bar-btn:first-child { margin-left: -8px; }
  html[data-shell="md"] .bar-btn { width: 48px; justify-content: center; border-radius: 50%; padding: 0; margin-left: -12px; }
  html[data-shell="md"] .bar-btn.done { width: auto; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 500; margin: 0 -8px 0 0; }
  .page-body { flex: 1; overflow-y: auto; padding: 8px var(--gutter-r) calc(48px + var(--sab)) var(--gutter-l); }

  .moods { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--lav); font: 500 14px/1 var(--f-ui); }
  html[data-shell="md"] .chip { border-radius: 8px; height: 32px; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; }
  .chip[aria-pressed="true"] { background: var(--lav); color: var(--night); border-color: var(--lav); }

  .qcard { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s; }
  html[data-shell="md"] .qcard { background: rgba(238, 242, 246, .075); border-color: transparent; }
  .qcard:focus-within { border-color: rgba(238, 242, 246, .4); }
  .qcard.gold { border-color: rgba(251, 191, 36, .45); background: linear-gradient(170deg, rgba(251, 191, 36, .13), rgba(251, 191, 36, .03) 70%); box-shadow: 0 14px 40px -24px rgba(251, 191, 36, .8); }
  .qcard.gold:focus-within { border-color: var(--gold); }
  .qhead { display: flex; align-items: center; gap: 8px; }
  .cat { display: inline-flex; align-items: center; gap: 5px; font: 700 11px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .qcard.gold .cat, .cat.gold { color: var(--gold); }
  .reroll { position: relative; overflow: hidden; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 0; background: var(--surface); color: var(--muted); font: 500 12px/1 var(--f-ui); }
  .qtext { margin: 0; font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 21px; line-height: 1.3; text-wrap: balance; }
  .qcard.gold .qtext { color: #FDE68A; }
  .qcard textarea { width: 100%; min-height: 88px; padding: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--ivory); font: 400 17px/1.55 var(--f-ui); }
  .qcard textarea::placeholder { color: var(--faint); }
  .save-state { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--faint); }

  /* ---------- Calendario ---------- */
  .cal-head { display: flex; align-items: center; gap: 8px; }
  .cal-head h2 { margin: 0; flex: 1; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.2; }
  .cal-head h2 span { color: var(--faint); }
  .icon-btn { position: relative; overflow: hidden; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--surface); color: var(--lav); }
  .icon-btn:disabled { opacity: .3; }
  .cal-swipe { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-grid.in-left { animation: inL .35s var(--ease-ios); }
  .cal-grid.in-right { animation: inR .35s var(--ease-ios); }
  @keyframes inL { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
  @keyframes inR { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
  .wd { text-align: center; font: 600 11px/1 var(--f-ui); color: var(--faint); letter-spacing: .08em; padding-bottom: 6px; }
  .day {
    position: relative; overflow: hidden; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center;
    border: 0; background: transparent; color: var(--lav); font: 500 15px/1 var(--f-ui); font-variant-numeric: tabular-nums;
    border-radius: 50%; transition: transform .15s;
  }
  html[data-shell="md"] .day { border-radius: 14px; }
  .day:not(.pad):not(:disabled):active { transform: scale(.92); }
  .day:not(.pad):not(.written):not(:disabled) { background: rgba(238, 242, 246, .04); }
  .day:disabled { opacity: .28; }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--lav); }
  .day.written {
    color: var(--night); font-weight: 700;
    background: radial-gradient(circle at 50% 38%, #FEF3C7 0%, var(--gold) 55%, #D97706 100%);
    box-shadow: 0 0 16px 1px rgba(251, 191, 36, .55), 0 0 0 1px rgba(253, 230, 138, .7);
  }
  .day.written.today { box-shadow: 0 0 16px 1px rgba(251, 191, 36, .55), inset 0 0 0 2px var(--ivory); }
  .day.written::after {
    content: ""; position: absolute; top: 16%; right: 20%; width: 5px; height: 5px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px 2px rgba(255, 255, 255, .9); animation: twinkle 3.2s ease-in-out infinite; animation-delay: var(--tw, 0s);
  }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; }

  /* ---------- Ajustes ---------- */
  .group { display: flex; flex-direction: column; }
  html[data-shell="ios"] .group { background: var(--surface); border-radius: 12px; overflow: hidden; }
  .row { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 10px 16px; border: 0; background: none; color: var(--ivory); text-align: left; font: 400 16px/1.3 var(--f-ui); }
  html[data-shell="ios"] .row + .row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: .5px; background: var(--line); }
  html[data-shell="ios"] .row:active { background: var(--surface-2); }
  html[data-shell="md"] .row { min-height: 56px; padding: 8px 4px; }
  .row .ri { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); color: var(--lav); flex: none; }
  html[data-shell="md"] .row .ri { background: none; width: 24px; }
  .row .rt { flex: 1; min-width: 0; }
  .row .rt small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .row.gold .ri { color: var(--gold); background: var(--gold-soft); }
  html[data-shell="md"] .row.gold .ri { background: none; }
  .row.danger { color: var(--danger); }
  .row.danger .ri { color: var(--danger); }
  .chev { color: var(--faint); }
  html[data-shell="md"] .chev { display: none; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; }
  html[data-shell="ios"] .seg { background: rgba(118, 118, 128, .26); border-radius: 9px; }
  .seg button { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; border: 0; background: none; color: var(--lav); font: 500 14px/1 var(--f-ui); }
  html[data-shell="ios"] .seg button { border-radius: 7px; }
  html[data-shell="ios"] .seg button[aria-pressed="true"] { background: rgba(238, 242, 246, .22); font-weight: 600; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
  html[data-shell="md"] .seg { gap: 0; padding: 0; border: 1px solid var(--faint); border-radius: 999px; overflow: hidden; }
  html[data-shell="md"] .seg button { height: 40px; }
  html[data-shell="md"] .seg button + button { border-left: 1px solid var(--faint); }
  html[data-shell="md"] .seg button[aria-pressed="true"] { background: rgba(251, 191, 36, .2); color: var(--ivory); }
  .seg .tick { display: none; }
  html[data-shell="md"] .seg button[aria-pressed="true"] .tick { display: block; }
  .fine { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .fine strong { color: var(--lav); font-weight: 600; }

  /* ---------- Hoja inferior y diálogos ---------- */
  .scrim { position: absolute; inset: 0; z-index: 30; background: rgba(8, 6, 28, .55); opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  #app.sheet-open .scrim, #app.dialog-open .scrim { opacity: 1; visibility: visible; transition: opacity .35s, visibility 0s; }
  #app.dialog-open .scrim { z-index: 55; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 88%; display: flex; flex-direction: column;
    background: var(--sheet); transform: translateY(105%); visibility: hidden;
    transition: transform .42s var(--ease-ios), visibility 0s .42s;
    box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, .6);
  }
  #app.sheet-open .sheet { transform: none; visibility: visible; transition: transform .42s var(--ease-ios), visibility 0s; }
  html[data-shell="ios"] .sheet { border-radius: 14px 14px 0 0; }
  html[data-shell="ios"] #app.sheet-open #base { transform: scale(.93) translateY(calc(var(--sat) + 8px)); border-radius: 14px; filter: brightness(.75); }
  html[data-shell="md"] .sheet { border-radius: 28px 28px 0 0; transition: transform .4s var(--ease-md), visibility 0s .4s; }
  html[data-shell="md"] #app.sheet-open .sheet { transition: transform .4s var(--ease-md), visibility 0s; }
  .grab { flex: none; display: grid; place-items: center; height: 26px; touch-action: none; cursor: grab; }
  .grab i { width: 36px; height: 5px; border-radius: 3px; background: rgba(238, 242, 246, .35); }
  html[data-shell="md"] .grab { height: 36px; }
  html[data-shell="md"] .grab i { width: 32px; height: 4px; background: var(--muted); }
  .sheet-body { overflow-y: auto; padding: 4px var(--gutter-r) calc(24px + var(--sab)) var(--gutter-l); display: flex; flex-direction: column; gap: 16px; }
  .sheet-head { touch-action: none; }
  .sheet-title { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.15; text-wrap: balance; }

  .dialog-wrap { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; pointer-events: none; }
  .dialog { pointer-events: auto; width: 100%; opacity: 0; visibility: hidden; transform: scale(1.1); transition: opacity .2s, transform .25s var(--ease-ios), visibility 0s .25s; }
  #app.dialog-open .dialog { opacity: 1; visibility: visible; transform: none; transition: opacity .2s, transform .25s var(--ease-ios), visibility 0s; }
  .dialog h3 { margin: 0; }
  .dialog p { margin: 0; }
  .dialog input { width: 100%; font: 400 16px/1.2 var(--f-ui); color: var(--ivory); background: rgba(8, 6, 28, .35); border: 1px solid var(--line); outline: 0; }
  .dialog input:focus { border-color: var(--lav); }
  .dlg-err { color: var(--danger); font-size: 13px; min-height: 0; }
  html[data-shell="ios"] .dialog { max-width: 290px; border-radius: 14px; overflow: hidden; text-align: center; background: rgba(46, 43, 115, .94); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
  html[data-shell="ios"] .dlg-body { padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  html[data-shell="ios"] .dialog h3 { font: 600 17px/1.3 var(--f-ui); }
  html[data-shell="ios"] .dialog p { font-size: 13px; line-height: 1.4; color: var(--lav); }
  html[data-shell="ios"] .dialog input { height: 34px; padding: 0 8px; border-radius: 7px; font-size: 15px; }
  html[data-shell="ios"] .dlg-actions { display: flex; border-top: .5px solid var(--line); }
  html[data-shell="ios"] .dlg-actions.stacked { flex-direction: column; }
  html[data-shell="ios"] .dlg-actions button { flex: 1; height: 46px; border: 0; background: none; color: var(--lav); font: 400 17px/1 var(--f-ui); }
  html[data-shell="ios"] .dlg-actions button + button { border-left: .5px solid var(--line); }
  html[data-shell="ios"] .dlg-actions.stacked button + button { border-left: 0; border-top: .5px solid var(--line); }
  html[data-shell="ios"] .dlg-actions button.default { font-weight: 600; color: var(--gold); }
  html[data-shell="ios"] .dlg-actions button.destructive { color: #FB7185; }
  html[data-shell="md"] .dialog { max-width: 340px; border-radius: 28px; background: #34317F; padding: 24px; }
  html[data-shell="md"] .dlg-body { display: flex; flex-direction: column; gap: 14px; }
  html[data-shell="md"] .dialog h3 { font: 400 24px/32px var(--f-ui); }
  html[data-shell="md"] .dialog p { font-size: 14px; line-height: 20px; color: var(--muted); }
  html[data-shell="md"] .dialog input { height: 52px; padding: 0 14px; border-radius: 6px; }
  html[data-shell="md"] .dlg-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  html[data-shell="md"] .dlg-actions button { position: relative; overflow: hidden; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--gold); font: 500 14px/1 var(--f-ui); }
  html[data-shell="md"] .dlg-actions button.destructive { color: var(--danger); }
  html .dialog p.dlg-err { color: var(--danger); font-size: 13px; }
  html .dialog p.dlg-err:empty { display: none; }

  /* ---------- Candado ---------- */
  .lock {
    position: absolute; inset: 0; z-index: 40; display: flex; overflow-y: auto;
    padding: calc(var(--sat) + 32px) var(--gutter-r) calc(var(--sab) + 32px) var(--gutter-l);
    background: radial-gradient(90% 50% at 50% 18%, rgba(251, 191, 36, .10), transparent 60%), radial-gradient(110% 60% at -15% 112%, var(--plum), transparent 62%), var(--indigo);
    transition: opacity .5s ease, visibility 0s .5s;
  }
  .lock.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .lock-inner { margin: auto; width: 100%; max-width: 330px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .moon { width: 78px; height: 78px; border-radius: 50%; box-shadow: inset -17px 7px 0 0 var(--gold); transform: rotate(-22deg); filter: drop-shadow(0 0 22px rgba(251, 191, 36, .5)); margin-bottom: 8px; }
  .lock-title { margin: 0; font-family: var(--f-display); font-weight: 300; font-size: 54px; line-height: 1; letter-spacing: -.02em; font-variation-settings: "opsz" 144; }
  .lock-sub { margin: 0 0 18px; font-family: var(--f-display); font-style: italic; font-size: 18px; color: var(--lav); opacity: .85; }
  .lock form { width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .lock label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 2px; }
  .lock input { width: 100%; height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(8, 6, 28, .3); color: var(--ivory); font: 400 17px/1 var(--f-ui); outline: 0; letter-spacing: .08em; }
  .lock input:focus { border-color: var(--lav); }
  .lock-err { margin: 0; min-height: 18px; font-size: 14px; color: var(--danger); }
  .lock-note { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .link { border: 0; background: none; color: var(--lav); font: 500 14px/1 var(--f-ui); text-decoration: underline; text-underline-offset: 3px; padding: 8px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  .toast {
    position: absolute; z-index: 70; left: 50%; bottom: calc(96px + var(--sab)); transform: translate(-50%, 20px);
    display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); width: max-content;
    padding: 12px 18px; border-radius: 999px; background: var(--lav); color: var(--night); font: 500 14px/1.3 var(--f-ui);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s var(--ease-ios); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .6);
  }
  html[data-shell="md"] .toast { border-radius: 6px; left: 16px; right: 16px; width: auto; transform: translateY(20px); background: #E6E1F5; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  html[data-shell="md"] .toast.show { transform: none; }
  .toast.gold { background: var(--gold); }

  .veil #base, .veil .page { filter: blur(22px) !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="app" data-tab="hoy">
  <div id="stars" aria-hidden="true"></div>

  <div id="base">
    <header class="topbar" id="topbar">
      <h1 class="tb-title" id="tbTitle">Velada</h1>
      <button class="shell-switch" id="shellSwitch" type="button" role="switch" aria-checked="false" aria-label="Cambiar estilo entre iOS y Android Material">
        <i class="knob"></i><span data-v="ios">iOS</span><span data-v="md">M3</span>
      </button>
      <button class="btn-export" type="button" data-act="export" aria-label="Exportar mi diario (JSON)" title="Exportar mi diario (JSON)">
        <span data-ic="download" data-size="17"></span><span>JSON</span>
      </button>
    </header>

    <main id="views">
      <section class="view active" id="v-hoy" aria-label="Hoy"></section>
      <section class="view" id="v-cal" aria-label="Calendario"></section>
      <section class="view" id="v-ajustes" aria-label="Ajustes"></section>
    </main>

    <button class="fab" id="fab" type="button" data-act="new"><span data-ic="pen"></span><span class="fab-label">Nueva entrada</span></button>

    <nav class="tabbar" aria-label="Secciones">
      <button class="tab active" type="button" data-tab="hoy"><span class="tab-ic" data-ic="moon" data-size="24"></span><span>Hoy</span></button>
      <button class="tab" type="button" data-tab="cal"><span class="tab-ic" data-ic="calendar" data-size="24"></span><span>Calendario</span></button>
      <button class="tab" type="button" data-tab="ajustes"><span class="tab-ic" data-ic="sliders" data-size="24"></span><span>Ajustes</span></button>
    </nav>
  </div>

  <section class="page" id="editor" aria-label="Entrada">
    <header class="topbar page-bar">
      <button class="bar-btn" type="button" data-act="back" aria-label="Volver"><span class="ios-only" data-ic="chevL" data-size="26"></span><span class="ios-only">Volver</span><span class="md-only" data-ic="arrowL" data-size="24"></span></button>
      <h2 class="tb-title" id="edTitle">Esta noche</h2>
      <button class="bar-btn done" type="button" data-act="back"><span class="ios-only">Listo</span><span class="md-only">Guardar</span></button>
    </header>
    <div class="page-body" id="edBody"></div>
  </section>

  <div class="scrim" id="scrim" data-act="dismiss"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" id="grab"><i></i></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <div class="dialog-wrap"><div class="dialog" id="dialog" role="alertdialog" aria-modal="true"></div></div>

  <section class="lock" id="lock" aria-label="Diario bloqueado">
    <div class="lock-inner" id="lockInner">
      <div class="moon" aria-hidden="true"></div>
      <h1 class="lock-title">Velada</h1>
      <p class="lock-sub">Un cuaderno para el final del día</p>
      <form id="lockForm" autocomplete="off" novalidate>
        <div>
          <label for="pass1" id="pass1Label">Tu clave</label>
          <input id="pass1" type="password" autocomplete="current-password" spellcheck="false">
        </div>
        <div id="pass2Row">
          <label for="pass2">Repite la clave</label>
          <input id="pass2" type="password" autocomplete="new-password" spellcheck="false">
        </div>
        <p class="lock-err" id="lockErr" role="alert"></p>
        <button class="btn btn-primary w-full" id="lockBtn" type="submit">Abrir mi diario</button>
      </form>
      <p class="lock-note" id="lockNote"></p>
      <button class="link" id="forgot" type="button" data-act="forgot">Olvidé mi clave</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const app = $('#app');
  const IS_ARTIFACT = !!window.__ARTIFACT__;
  const VAULT_KEY = 'velada.vault.v1', PREFS_KEY = 'velada.prefs';
  const ITER = 310000;
  const AUTOLOCK_MS = 5 * 60 * 1000;

  // ---------- Iconos (trazos estilo Lucide) ----------
  const P = {
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
    pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    chevL: '<path d="m15 18-6-6 6-6"/>',
    chevR: '<path d="m9 18 6-6-6-6"/>',
    arrowL: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
    shuffle: '<path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>',
    sparkle: '<path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3Z"/>',
    lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
    trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',
    phone: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>'
  };
  const ic = (name, size = 22, sw = 1.8) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name] || ''}</svg>`;
  const fillIcons = (root = document) => $$('[data-ic]', root).forEach(el => { el.innerHTML = ic(el.dataset.ic, +el.dataset.size || 22); el.removeAttribute('data-ic'); });

  // ---------- Utilidades ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };
  let prefs = {};
  try { prefs = JSON.parse(store.get(PREFS_KEY) || '{}') || {}; } catch { prefs = {}; }
  const savePrefs = () => store.set(PREFS_KEY, JSON.stringify(prefs));

      if (lockMode === 'create') {
        vault = { v: 1, kdf: newKdf(), data: null };
        key = await deriveKey(p1, unb64(vault.kdf.salt), vault.kdf.iter);
        data = { entries: {}, created: Date.now() };
        await persist();
      } else {
        const k = await deriveKey(p1, unb64(vault.kdf.salt), vault.kdf.iter);
        const d = await unseal(k, vault.data);
        key = k; data = d && typeof d === 'object' ? d : { entries: {} };
        data.entries = data.entries || {};
      }
      enterApp();
    } catch (ex) {
      fail(lockMode === 'create' ? 'No se pudo crear el diario en este navegador.' : 'Esa no es tu clave. Inténtalo de nuevo.');
    } finally {
      btn.disabled = false; btn.textContent = lockMode === 'create' ? 'Crear mi diario' : 'Abrir mi diario';
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); app.classList.add('veil'); if (ed) { commitEditor(); persist(); } }
    else { app.classList.remove('veil'); if (key && hiddenAt && Date.now() - hiddenAt > AUTOLOCK_MS) lockNow(); }
  });

  // ---------- Acciones ----------
  const actions = {
    new: () => openEditor(todayISO(), true),
    continue: () => openEditor(todayISO(), false),
    more: () => {
      ed.items.push(...pickSet(new Set(ed.items.map(i => i.q))));
      const y = $('#edBody').scrollTop; renderEditor(); $('#edBody').scrollTop = y;
      const cards = $$('.qcard', $('#edBody')); cards[cards.length - 3] && cards[cards.length - 3].scrollIntoView({ behavior: 'smooth', block: 'start' });
      tick();
    },
    back: () => popLayer(),
    dismiss: () => popLayer(),
    day: el => { if (Date.now() < suppressClickUntil) return; openDay(el.dataset.date); },
    'edit-day': async el => { const d = el.dataset.date; await popLayer(); openEditor(d, !isWritten(data.entries[d])); },
    prev: () => shiftMonth(-1),
    next: () => shiftMonth(1),
    thismonth: () => { const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); renderCal(1); },
    shell: el => { applyShell(el.dataset.shellOpt, true); renderAjustes(); tick(); },
    mood: el => { ed.mood = ed.mood === el.dataset.mood ? null : el.dataset.mood; $$('.chip', $('#edBody')).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.mood === ed.mood))); scheduleSave(); tick(); },
    reroll: el => {
      const idx = +el.dataset.idx, it = ed.items[idx]; if (!it || it.a.trim()) return;
      const exclude = new Set(ed.items.map(i => i.q)), recent = recentQuestions(14);
      let pick;
      if (it.cat === 'gratitud') pick = pickQuestion('gratitud', exclude, recent);
      else {
        const used = new Set(ed.items.map(i => i.cat));
        const cats = shuffle(Object.keys(CATS).filter(c => c !== 'gratitud' && (c === it.cat || !used.has(c))));
        for (const c of cats) { pick = pickQuestion(c, exclude, recent); if (pick) break; }
      }
      if (!pick) return;
      it.cat = pick[0]; it.q = pick[1];
      const card = el.closest('.qcard');
      card.classList.toggle('gold', it.cat === 'gratitud');
      card.querySelector('.cat').innerHTML = (it.cat === 'gratitud' ? ic('sparkle', 14) : '') + esc(catLabel(it.cat));
      const q = card.querySelector('.qtext'); q.textContent = it.q;
      q.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'ease-out' });
      tick();
    },
    export: () => openExport(),
    'exp-fmt': el => { expFmt = el.dataset.fmt; updateExpNote(); tick(); },
    'exp-save': async () => {
      const name = `velada-diario-${todayISO()}${expFmt === 'vault' ? '-cifrado' : ''}.json`;
      try {
        await saving;
        const how = await saveFile(name, expFmt === 'plain' ? plainExport() : vaultExport());
        toast(how === 'shared' ? 'Archivo listo para guardar' : 'Descarga iniciada: ' + name, true);
      } catch (err) {
        if (err && (err.name === 'AbortError' || /cancel/i.test(err.message || ''))) return;
        toast('No se pudo guardar el archivo. Usa “Copiar el JSON”.');
      }
    },
    'exp-copy': async () => {
      const ok = await copyText(expFmt === 'plain' ? plainExport() : vaultExport());
      toast(ok ? 'JSON copiado al portapapeles' : 'Tu navegador no dejó copiar el texto', ok);
    },
    import: () => $('#importFile').click(),
    lock: () => lockNow(),
    'change-pass': async () => {
      const r = await dialog({
        title: 'Cambiar clave', message: 'Tu diario se volverá a cifrar con la clave nueva.',
        fields: [{ id: 'cur', type: 'password', placeholder: 'Clave actual' }, { id: 'n1', type: 'password', placeholder: 'Clave nueva' }, { id: 'n2', type: 'password', placeholder: 'Repite la clave nueva' }],
        actions: [{ label: 'Cancelar', value: null }, { label: 'Cambiar', role: 'default', value: 'ok', validate: async v => {
          if (v.n1.length < 4) return 'La clave nueva necesita al menos 4 caracteres.';
          if (v.n1 !== v.n2) return 'Las claves nuevas no coinciden.';
          try { const k = await deriveKey(v.cur, unb64(vault.kdf.salt), vault.kdf.iter); await unseal(k, vault.data); } catch { return 'La clave actual no es correcta.'; }
          await saving;
          const kdf = newKdf();
          key = await deriveKey(v.n1, unb64(kdf.salt), kdf.iter);
          vault.kdf = kdf; await persist();
          return null;
        } }]
      });
      if (r.action === 'ok') toast('Clave cambiada', true);
    },
    wipe: async () => {
      const r = await dialog({
        title: '¿Borrar todo el diario?', message: 'Se eliminarán todas tus noches de este dispositivo y no se podrán recuperar. Si quieres conservarlas, exporta antes una copia.',
        actions: [{ label: 'Borrar todo', role: 'destructive', value: 'del' }, { label: 'Cancelar', role: 'default', value: null }], stacked: true
      });
      if (r.action !== 'del') return;
      await saving; store.del(VAULT_KEY); vault = null; lockNow(); toast('Diario borrado');
    },
    forgot: async () => {
      const r = await dialog({
        title: 'No hay forma de recuperarla', message: 'Tu diario está cifrado con esa clave y no existe ninguna copia en un servidor. Puedes empezar un diario nuevo, pero el actual se borrará.',
        actions: [{ label: 'Borrar y empezar de nuevo', role: 'destructive', value: 'del' }, { label: 'Seguir intentando', role: 'default', value: null }], stacked: true
      });
      if (r.action === 'del') { store.del(VAULT_KEY); vault = null; showLock('create'); }
    }
  };
  document.addEventListener('click', e => {
    const tb = e.target.closest('.tab');
    if (tb) { if (tb.dataset.tab !== tab) { setTab(tb.dataset.tab); tick(); } else { const v = $('#v-' + tab); v.scrollTo({ top: 0, behavior: 'smooth' }); } return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act];
    if (fn) fn(el, e);
  });
  $('#shellSwitch').addEventListener('click', () => { applyShell(shell() === 'ios' ? 'md' : 'ios', true); if (key) renderAjustes(); tick(); });

  // Onda táctil de Material
  document.addEventListener('pointerdown', e => {
    if (shell() !== 'md') return;
    const el = e.target.closest('.btn, .tab-ic, .row, .fab, .day:not(.pad), .chip, .bar-btn, .icon-btn, .seg button, .dlg-actions button, .reroll, .list-row');
    if (!el || el.disabled) return;
    const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
    const s = document.createElement('span');
    s.className = 'rip';
    s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    el.appendChild(s); setTimeout(() => s.remove(), 600);
  });

  // ---------- Arranque ----------
  fillIcons();
  applyShell(prefs.shell === 'md' || prefs.shell === 'ios' ? prefs.shell : detectShell());
  try { vault = JSON.parse(store.get(VAULT_KEY) || 'null'); } catch { vault = null; }
  if (vault && !(vault.kdf && vault.data)) vault = null;
  showLock(vault ? 'unlock' : 'create');
  if (!IS_ARTIFACT && !window.Capacitor && 'serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
<!-- @artifact-end -->
</body>
</html>
